<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FEF4EA">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="פרומפטר">
<title>הפרומפטר של שמרית</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:Heebo;font-style:normal;font-display:swap;font-weight:400;src:url(fonts/heebo-hebrew-400.woff2) format('woff2');unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:Heebo;font-style:normal;font-display:swap;font-weight:500;src:url(fonts/heebo-hebrew-500.woff2) format('woff2');unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:Heebo;font-style:normal;font-display:swap;font-weight:700;src:url(fonts/heebo-hebrew-700.woff2) format('woff2');unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:Heebo;font-style:normal;font-display:swap;font-weight:800;src:url(fonts/heebo-hebrew-800.woff2) format('woff2');unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:Heebo;font-style:normal;font-display:swap;font-weight:400;src:url(fonts/heebo-latin-400.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Heebo;font-style:normal;font-display:swap;font-weight:500;src:url(fonts/heebo-latin-500.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Heebo;font-style:normal;font-display:swap;font-weight:700;src:url(fonts/heebo-latin-700.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Heebo;font-style:normal;font-display:swap;font-weight:800;src:url(fonts/heebo-latin-800.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--cream:#FEF4EA;--peri:#7887DB;--peri-d:#4d5bb0;--coral:#DD7E7C;--ink:#2b2b45;--muted:#6b6b82;--ok:#3f9c72;--rec:#E5484D;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--cream)}
body{font-family:Heebo,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* מסך הטקסט */
.wrap{max-width:640px;margin:0 auto;padding:calc(14px + var(--st)) 16px calc(112px + var(--sb))}
.brand{display:flex;align-items:center;gap:12px;margin:6px 2px 14px}
.brand img{width:46px;height:46px;border-radius:14px;box-shadow:0 6px 14px rgba(77,91,176,.25);flex:none}
.brand h1{font-size:21px;font-weight:800;margin:0;line-height:1.2}
.brand p{margin:2px 0 0;color:var(--muted);font-size:14.5px;line-height:1.4}
.ta{display:block;width:100%;height:calc(100vh - 290px);height:calc(100dvh - 290px);min-height:240px;border:0;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 1.5px #e2e0ee,0 8px 22px rgba(120,135,219,.10);font-size:18px;line-height:1.7;padding:14px 16px;outline:none;color:var(--ink);resize:none}
.ta:focus{box-shadow:inset 0 0 0 2px var(--peri)}
.tools{display:flex;align-items:center;gap:8px;margin:10px 0 0;flex-wrap:wrap}
.tools .count{margin-inline-start:auto;font-size:14px;color:var(--muted)}
.hint{font-size:14px;color:var(--muted);margin:10px 4px 0;line-height:1.55}
.brand .inst{margin-inline-start:auto;flex:none}
.dock{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + var(--sb));background:linear-gradient(rgba(254,244,234,0),var(--cream) 40%);display:flex;justify-content:center;z-index:5}
.btn{min-height:52px;border-radius:999px;padding:0 24px;font-weight:800;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn svg{width:22px;height:22px}
.btn.primary{background:var(--peri);color:#fff;box-shadow:0 10px 22px rgba(77,91,176,.3)}
.btn.ghost{background:#fff;color:var(--peri-d);box-shadow:inset 0 0 0 1.5px var(--peri)}
.btn.soft{background:rgba(120,135,219,.13);color:var(--peri-d)}
.btn.wide{width:100%;max-width:440px}
.btn.sm{min-height:40px;font-size:15px;padding:0 16px}
.btn[aria-disabled="true"]{opacity:.5;box-shadow:none}

/* מסך הצילום */
.pv{position:fixed;inset:0;background:#000;color:#fff;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;z-index:10}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#15151d;transform:scaleX(-1)}
.panel{position:absolute;top:0;left:0;right:0;height:var(--ph,40vh);z-index:2;background:linear-gradient(to bottom,rgba(12,12,24,.5) 0,rgba(12,12,24,.43) 80%,rgba(12,12,24,0) 100%)}
.pv.land .panel{bottom:0;height:auto;width:var(--pw,44vw)}
.pv.lens-left .panel{left:0;right:auto;background:linear-gradient(to right,rgba(12,12,24,.52) 0,rgba(12,12,24,.45) 84%,rgba(12,12,24,0) 100%)}
.pv.lens-right .panel{right:0;left:auto;background:linear-gradient(to left,rgba(12,12,24,.52) 0,rgba(12,12,24,.45) 84%,rgba(12,12,24,0) 100%)}
.vp{position:absolute;top:var(--st);left:0;right:0;bottom:0;overflow:hidden;touch-action:none;cursor:grab;
  -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.32) 0,rgba(0,0,0,.32) calc(var(--rl,90px) - var(--lh,48px)*.55),#000 calc(var(--rl,90px) + var(--lh,48px)*.1),#000 86%,transparent 100%);
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.32) 0,rgba(0,0,0,.32) calc(var(--rl,90px) - var(--lh,48px)*.55),#000 calc(var(--rl,90px) + var(--lh,48px)*.1),#000 86%,transparent 100%)}
.pv.land .vp{bottom:var(--sb)}
.pv.lens-left .vp{left:var(--sl)}.pv.lens-right .vp{right:var(--sr)}
.ptext{position:absolute;top:0;left:0;right:0;margin:0 auto;width:var(--tw,90%);padding:var(--rl,90px) 0 var(--pb,200px);font-size:var(--fs,34px);line-height:1.42;font-weight:700;text-align:right;will-change:transform;text-shadow:0 1px 3px rgba(0,0,0,.8),0 0 16px rgba(0,0,0,.35);overflow-wrap:anywhere}
.ptext .gap{height:.5em}.ptext .gap+.gap{display:none}
.ptext .end{color:rgba(255,255,255,.5);font-size:.55em;text-align:center;margin-top:1em}
.marker{position:absolute;right:3px;top:calc(var(--st) + var(--rl,90px) + var(--lh,48px)/2);transform:translateY(-50%);width:0;height:0;border-top:10px solid transparent;border-bottom:10px solid transparent;border-right:13px solid var(--coral);filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));pointer-events:none}
.prog{position:absolute;left:14px;right:14px;bottom:8px;height:3px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden;pointer-events:none}
.prog i{display:block;height:100%;background:var(--peri);transform-origin:right center;transform:scaleX(0)}
.pv.land .prog{bottom:calc(8px + var(--sb))}
.hud{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:18px 12px calc(14px + var(--sb));display:flex;flex-direction:column;align-items:center;gap:12px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.5))}
.pv.lens-left .hud{left:var(--pw,44vw);right:0}.pv.lens-right .hud{right:var(--pw,44vw);left:0}
.status{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:999px;background:rgba(18,18,30,.55);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.status svg{width:16px;height:16px}
.rdot{width:9px;height:9px;border-radius:50%;background:var(--rec);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.meter{width:44px;height:6px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden}
.meter i{display:block;height:100%;background:#7ee2a8;transform-origin:right center;transform:scaleX(0)}
.adjust{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.stepper{display:flex;align-items:center;height:44px;border-radius:999px;background:rgba(18,18,30,.55);padding:0 2px}
.stepper button{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:700}
.stepper button:active{background:rgba(255,255,255,.16)}
.stepper span{min-width:72px;text-align:center;font-size:14.5px;font-weight:700;white-space:nowrap}
.row{display:flex;align-items:center;justify-content:center;gap:16px}
.round{width:50px;height:50px;border-radius:50%;background:rgba(18,18,30,.55);display:grid;place-items:center;color:#fff}
.round:active{background:rgba(255,255,255,.22)}
.rec{width:76px;height:76px;border-radius:50%;box-shadow:inset 0 0 0 4px #fff;display:grid;place-items:center}
.rec i{width:56px;height:56px;border-radius:50%;background:var(--rec);transition:all .2s}
.rec.on i{width:28px;height:28px;border-radius:7px}
.rec.arming i{animation:pulse .7s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(.84);opacity:.7}}
.pv.recording .hide-rec{visibility:hidden}
.countdown{position:absolute;inset:0;display:grid;place-items:center;z-index:6;font-size:140px;font-weight:800;color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.6);pointer-events:none}
.countdown b{display:block;animation:cd .9s ease-out both}
@keyframes cd{from{transform:scale(1.4);opacity:0}30%{opacity:1}to{transform:scale(1);opacity:1}}
.cammsg{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);z-index:8;background:var(--cream);color:var(--ink);border-radius:22px;padding:20px;max-width:440px;margin:0 auto;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.cammsg h3{margin:0 0 8px;font-size:19px;font-weight:800}
.cammsg p{margin:0 0 14px;line-height:1.6;font-size:15px;color:#4a4a60}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.acts .btn{flex:1;padding:0 14px}
.sheet{position:absolute;inset:0;z-index:9;background:rgba(10,10,20,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet-c{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--cream);color:var(--ink);border-radius:26px 26px 0 0;padding:18px 20px calc(20px + var(--sb))}
.pv.land .sheet{align-items:center}.pv.land .sheet-c{border-radius:22px;max-height:96%}
.sheet video{width:100%;max-height:48vh;border-radius:16px;background:#000;display:block}
.pv.land .sheet video{max-height:52vh}
.rmeta{font-size:15px;font-weight:700;margin:10px 2px 14px}
.stack{display:flex;flex-direction:column;gap:10px}
.note{font-size:14px;color:var(--ok);margin:10px 2px 0;line-height:1.5;font-weight:600}
.dlg{position:fixed;inset:0;z-index:50;background:rgba(10,10,20,.5);display:flex;align-items:center;justify-content:center;padding:20px}
.dlg-c{background:var(--cream);color:var(--ink);border-radius:22px;padding:20px;max-width:380px;width:100%;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.dlg-c h3{margin:0 0 6px;font-size:18px;font-weight:800}
.dlg-c p{margin:0 0 16px;color:#4a4a60;line-height:1.55}
.dlg-c .acts{flex-direction:column}
.toast{position:fixed;left:50%;bottom:calc(150px + var(--sb));transform:translate(-50%,16px);opacity:0;z-index:60;background:rgba(30,30,46,.93);color:#fff;font-size:15px;font-weight:600;padding:10px 16px;border-radius:14px;width:max-content;max-width:min(92vw,460px);text-align:center;line-height:1.45;transition:opacity .25s,transform .25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.in-pv .toast{bottom:auto;top:50%}
</style>
</head>
<body>

<!-- הטקסט -->
<section id="homeView">
  <div class="wrap">
    <div class="brand">
      <img src="icons/icon-192.png" alt="">
      <div>
        <h1>הפרומפטר של שמרית</h1>
        <p>מדביקים טקסט או כותבים, ומצלמים כשהוא רץ ליד העדשה.</p>
      </div>
      <button id="installBtn" class="btn ghost sm inst" type="button" hidden>התקנה</button>
    </div>
    <textarea id="txt" class="ta" placeholder="מדביקים כאן דף טקסטים, או כותבים בעצמך" aria-label="הטקסט לצילום"></textarea>
    <div class="tools">
      <button id="pasteBtn" class="btn soft sm" type="button"></button>
      <button id="clearBtn" class="btn soft sm" type="button" hidden>ניקוי</button>
      <span id="count" class="count"></span>
    </div>
    <p id="startHint" class="hint" hidden>רוצה להתחיל מאמצע הדף? נוגעים בשורה שממנה מתחילים, ואז ״לצילום״.</p>
    <p id="iosHint" class="hint" hidden>כדי לפתוח את הפרומפטר מסמל במסך הבית: בספארי לוחצים על כפתור השיתוף, ואז על הוספה למסך הבית.</p>
  </div>
  <div class="dock"><button id="goBtn" class="btn primary wide" type="button"></button></div>
</section>

<!-- המצלמה -->
<section id="camView" class="pv" hidden>
  <video id="cam" playsinline muted autoplay></video>
  <div id="panel" class="panel">
    <div id="vp" class="vp"><div id="ptext" class="ptext"></div></div>
    <i class="marker"></i>
    <div class="prog"><i id="prog"></i></div>
  </div>
  <div id="countdown" class="countdown" hidden></div>
  <div id="hud" class="hud">
    <div class="status"><span class="rdot" id="rdot" hidden></span><span id="stIc"></span><span id="stTime" hidden>0:00</span><span class="meter" id="meterBox"><i id="meter"></i></span></div>
    <div class="adjust">
      <div class="stepper"><button type="button" data-step="fs-" aria-label="הקטנת הטקסט">−</button><span>גודל <b id="fsVal"></b></span><button type="button" data-step="fs+" aria-label="הגדלת הטקסט">+</button></div>
      <div class="stepper"><button type="button" data-step="sp-" aria-label="האטה">−</button><span>מהירות <b id="spVal"></b></span><button type="button" data-step="sp+" aria-label="האצה">+</button></div>
    </div>
    <div class="row">
      <button id="pBack" class="round hide-rec" type="button" aria-label="חזרה לטקסט"></button>
      <button id="pRestart" class="round" type="button" aria-label="חזרה לנקודת ההתחלה"></button>
      <button id="pRec" class="rec" type="button" aria-label="הקלטה"><i></i></button>
      <button id="pPlay" class="round" type="button" aria-label="הפעלת הגלילה"></button>
      <button id="pSide" class="round hide-rec" type="button" aria-label="העברת הטקסט לצד השני" hidden></button>
    </div>
  </div>
  <div id="camMsg" class="cammsg" hidden>
    <h3 id="cmTitle"></h3>
    <p id="cmText"></p>
    <div class="acts">
      <button id="cmRetry" class="btn primary sm" type="button">ניסיון נוסף</button>
      <button id="cmBack" class="btn ghost sm" type="button">חזרה</button>
    </div>
  </div>
  <div id="review" class="sheet" hidden>
    <div class="sheet-c" role="dialog" aria-label="הטייק שצולם">
      <video id="takeVideo" playsinline controls preload="metadata"></video>
      <p class="rmeta" id="rvMeta"></p>
      <div class="stack">
        <button id="rvSave" class="btn primary" type="button"></button>
        <button id="rvShare" class="btn ghost" type="button"></button>
        <button id="rvRetake" class="btn soft" type="button">עוד טייק</button>
      </div>
      <p class="note" id="rvNote" hidden></p>
    </div>
  </div>
</section>

<div id="dlg" class="dlg" hidden>
  <div class="dlg-c" role="alertdialog" aria-labelledby="dlgT">
    <h3 id="dlgT"></h3>
    <p id="dlgP"></p>
    <div class="acts"><button id="dlgOk" class="btn primary sm" type="button"></button><button id="dlgNo" class="btn ghost sm" type="button"></button></div>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ---------- כלים ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || navigator.standalone === true;
const coarse = matchMedia('(pointer: coarse)').matches;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};
const K_TEXT = 'sp2.text', K_SET = 'sp2.settings', K_TIP = 'sp2.tip';

const ICON = {
  back: '<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  play: '<svg viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor" stroke="none"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/><rect x="13.5" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/></svg>',
  restart: '<svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5"/><path d="M4.5 4v5h5"/></svg>',
  paste: '<svg viewBox="0 0 24 24"><rect x="5.5" y="4.5" width="13" height="16" rx="2"/><path d="M9 4.5h6v3H9z"/></svg>',
  download: '<svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 20h14"/></svg>',
  share: '<svg viewBox="0 0 24 24"><path d="M12 14V3.5M7.5 8L12 3.5 16.5 8"/><path d="M5 12v7a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19v-7"/></svg>',

      const dir = await navigator.storage.getDirectory();
      try { for await (const name of dir.keys()) { if (name.startsWith('take-')) { try { await dir.removeEntry(name); } catch (e) {} } } } catch (e) {}
      const fh = await dir.getFileHandle('take-' + Date.now(), { create: true });
      const ws = await fh.createWritable();
      let q = Promise.resolve(), failed = false;
      return {
        push(b) { q = q.then(() => ws.write(b)).catch(() => { failed = true; }); },
        async finish(type) { await q; try { await ws.close(); } catch (e) { failed = true; } if (failed) throw new Error('write'); const f = await fh.getFile(); return new Blob([f], { type }); }
      };
    } catch (e) {}
  }
  const parts = [];
  return { push(b) { parts.push(b); }, async finish(type) { return new Blob(parts, { type }); } };
}
function setRecUI(on) {
  const b = $('#pRec');
  b.classList.toggle('on', on); b.classList.remove('arming');
  b.setAttribute('aria-label', on ? 'עצירת ההקלטה' : 'הקלטה');
  $('#camView').classList.toggle('recording', on);
  $('#rdot').hidden = !on; $('#stTime').hidden = !on; $('#stIc').hidden = on;
  if (on) $('#stTime').textContent = '0:00';
}
async function countdown(n) {
  counting = true; cancelCount = false;
  const box = $('#countdown'); box.hidden = false; $('#pRec').classList.add('arming');
  for (let i = n; i > 0; i--) {
    box.innerHTML = '<b>' + i + '</b>';
    for (let k = 0; k < 10; k++) { await sleep(100); if (cancelCount || view !== 'cam') { counting = false; box.hidden = true; $('#pRec').classList.remove('arming'); return false; } }
  }
  counting = false; box.hidden = true; $('#pRec').classList.remove('arming');
  return true;
}
$('#pRec').addEventListener('click', async () => {
  if (counting) { cancelCount = true; return; }
  if (rec && rec.state === 'recording') { stopRec(); return; }
  if (!window.MediaRecorder) { toast('הדפדפן הזה לא יודע להקליט וידאו. כדאי לנסות בכרום.'); return; }
  if (!stream) { toast('המצלמה עוד לא מוכנה.'); return; }
  if (actx && actx.state === 'suspended') actx.resume().catch(() => {});
  if (pos >= maxPos - 1) { pos = startPos(); paint(); }
  setPlaying(false); vel = 0;
  const ok = await countdown(3);
  if (!ok || !stream || view !== 'cam') return;
  const mime = pickMime();
  let r = null, sk = null;
  try {
    sk = await makeSink();
    const opts = { videoBitsPerSecond: 7000000, audioBitsPerSecond: 128000 };
    if (mime) opts.mimeType = mime;
    try { r = new MediaRecorder(stream, opts); } catch (e) { r = new MediaRecorder(stream); }
  } catch (e) { toast('לא הצלחתי להתחיל את ההקלטה.'); return; }
  r.ondataavailable = ev => { if (ev.data && ev.data.size) sk.push(ev.data); };
  r.onerror = () => { toast('ההקלטה נעצרה בגלל תקלה.'); try { r.stop(); } catch (e) {} };
  r.onstop = () => finishRec(r, sk);
  try { r.start(1000); } catch (e) { toast('לא הצלחתי להתחיל את ההקלטה.'); return; }
  rec = r; recT0 = performance.now(); lastClock = 0;
  setRecUI(true);
  setPlaying(true);
});
function stopRec() { setPlaying(false); if (rec && rec.state !== 'inactive') { try { rec.stop(); } catch (e) {} } }
async function finishRec(r, sk) {
  const dur = (performance.now() - recT0) / 1000;
  setRecUI(false);
  const type = (r.mimeType || pickMime() || 'video/webm').split(';')[0];
  let blob = null;
  try { blob = await sk.finish(type); } catch (e) { blob = null; }
  if (rec === r) rec = null;
  if (view !== 'cam') return;
  if (!blob || !blob.size) { toast('ההקלטה יצאה ריקה. כדאי לנסות שוב.'); return; }
  if (take) { try { URL.revokeObjectURL(take.url); } catch (e) {} }
  takeNo++;
  take = { blob, url: URL.createObjectURL(blob), ext: /mp4/.test(type) ? 'mp4' : 'webm', type, dur, n: takeNo, saved: false };
  openReview();
}

/* ---------- אחרי הצילום ---------- */
function fileName() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  const t = startLine().replace(/[\\/:*?"<>|״׳'…]+/g, '').replace(/\s+/g, ' ').trim().slice(0, 40).trim() || 'סרטון';
  return t + ' - טייק ' + take.n + ' - ' + p(d.getDate()) + '.' + p(d.getMonth() + 1) + ' ' + p(d.getHours()) + '-' + p(d.getMinutes()) + '.' + take.ext;
}
function takeFile() { return new File([take.blob], fileName(), { type: take.type }); }
function canShare() { try { return !!(navigator.canShare && take && navigator.canShare({ files: [takeFile()] })); } catch (e) { return false; } }
function note(t) { const n = $('#rvNote'); n.textContent = t; n.hidden = false; }
function openReview() {
  $('#rvMeta').textContent = 'טייק ' + take.n + ' · ' + clock(take.dur);
  $('#takeVideo').src = take.url;
  const share = canShare(), iosShare = isIOS && share;
  $('#rvSave').innerHTML = (iosShare ? ICON.share : ICON.download) + '<span>שמירה בטלפון</span>';
  $('#rvShare').innerHTML = ICON.share + '<span>שיתוף</span>';
  $('#rvShare').hidden = !share || iosShare;
  $('#rvNote').hidden = true;
  $('#review').hidden = false;
}
async function shareTake() {
  try { await navigator.share({ files: [takeFile()] }); take.saved = true; note('הסרטון נשלח ✓'); }
  catch (e) { if (!e || e.name !== 'AbortError') toast('השיתוף לא הצליח. אפשר לנסות ״שמירה בטלפון״.'); }
}
$('#rvSave').addEventListener('click', () => {
  if (!take) return;
  if (isIOS && canShare()) { shareTake(); return; }
  const a = document.createElement('a'); a.href = take.url; a.download = fileName(); a.rel = 'noopener';
  document.body.append(a); a.click(); a.remove();
  take.saved = true;
  note('הסרטון נשמר בטלפון, בתיקיית ההורדות ✓');
});
$('#rvShare').addEventListener('click', () => { if (take) shareTake(); });
$('#rvRetake').addEventListener('click', async () => {
  if (take && !take.saved && !(await ask('הטייק הזה עוד לא נשמר', 'אם ממשיכים, הוא יימחק.', 'להמשיך בלי לשמור', 'רגע, אשמור'))) return;
  $('#review').hidden = true; $('#takeVideo').pause();
  vel = 0; pos = startPos(); paint(); setPlaying(false);
});

/* ---------- התקנה ---------- */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('#installBtn').hidden = false; });
$('#installBtn').addEventListener('click', async () => { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch (e) {} installEvt = null; $('#installBtn').hidden = true; });
window.addEventListener('appinstalled', () => { $('#installBtn').hidden = true; });
if (isIOS && !isStandalone()) $('#iosHint').hidden = false;
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (view === 'cam') layout(); });
})();
</script>
